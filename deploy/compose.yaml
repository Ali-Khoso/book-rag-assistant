name: bookwise-production
services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in production.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the production Supabase URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the public key}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the HTTPS app origin}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    mem_limit: 512m
    cpus: 1
    security_opt: ["no-new-privileges:true"]

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      PROCESSING_ENABLED: "false"
      WARM_MODELS: "true"
      MODEL_CACHE_DIR: /app/.cache/models
      OLLAMA_URL: http://ollama:11434
    volumes: ["embedding-cache:/app/.cache"]
    depends_on:
      worker: {condition: service_started}
      model-init: {condition: service_completed_successfully}
    mem_limit: 768m
    cpus: 1
    security_opt: ["no-new-privileges:true"]

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: ./backend.env
    environment:
      WARM_MODELS: "true"
      MODEL_CACHE_DIR: /app/.cache/models
    volumes: ["embedding-cache:/app/.cache"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 1
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes: ["answer-models:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 5g
    cpus: 3

  model-init:
    image: ollama/ollama:0.40.11
    command: ["pull", "qwen2.5:3b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: {condition: service_healthy}
    restart: on-failure:3

volumes:
  embedding-cache:
  answer-models:
  edge-data:
  edge-config:
